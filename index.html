<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#18212f;background:#f4f7fb;--blue:#3567d6;--line:#dce3ec}*{box-sizing:border-box}html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent}button{font:inherit;touch-action:manipulation}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:22px}.muted{color:#687386;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.card,.stat{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #18212f0b}.stat{text-align:center;padding:10px}.stat b{display:block;font-size:20px}.card{padding:22px}.bar{height:10px;background:#e8edf4;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--blue);transition:.1s}.row{display:flex;justify-content:space-between;margin-top:10px}.word{text-align:center;font-size:46px;font-weight:900;margin:28px 0 4px;overflow-wrap:anywhere}.pos{text-align:center;color:#687386}.speak{display:block;margin:12px auto;border:0;background:#edf3ff;padding:10px 16px;border-radius:12px;font-weight:700}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.choices button,.next,.reset{min-height:54px;border:1px solid #d5deea;border-radius:14px;background:white;font-size:16px;font-weight:650;padding:10px}.choices button:hover{background:#f3f6fb}.choices button:active,.speak:active,.next:active{transform:scale(.985)}.feedback{text-align:center;font-weight:800;margin-top:18px;min-height:24px}.example{display:none;margin-top:15px;padding:15px;background:#f6f8fb;border-radius:14px;line-height:1.6}.next{display:none;width:100%;margin-top:14px;background:#18212f;color:white}.foot{text-align:center;margin-top:15px}.reset{min-height:42px;padding:6px 14px}.urgent{color:#c52b2b}@keyframes rightPop{0%{transform:scale(1)}45%{transform:scale(1.012);box-shadow:0 10px 28px #16803b22}100%{transform:scale(1)}}@keyframes wrongShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}.rightflash{animation:rightPop .45s ease}.wrongflash{animation:wrongShake .35s ease}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}.track{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}.trackbtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 9px;font-weight:850;color:#263449;cursor:pointer}.trackbtn small{display:block;margin-top:3px;font-size:11px;font-weight:500;color:#778195}.trackbtn.recommended:not(.active)::after{content:"推薦";display:inline-block;margin-left:4px;font-size:9px;color:#3567d6}.trackbtn.active{background:#18212f;color:#fff;border-color:#18212f}.trackbtn.active small{color:#d8dfeb}.welcome{display:none;align-items:center;gap:10px;background:#edf3ff;border:1px solid #d7e3ff;border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:13px}.welcome span{flex:1;color:#526079}.welcome button{border:0;background:#18212f;color:#fff;border-radius:9px;padding:7px 10px;font-weight:700}.tracknote{text-align:center;margin-bottom:4px}.mastery{margin:9px 0 12px}.masteryrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#596579;margin-bottom:5px}.masterybar{height:6px;background:#e6ebf2;border-radius:10px;overflow:hidden}.masterybar i{display:block;height:100%;width:0;background:var(--blue);transition:width .35s ease}
@media(max-width:600px){
 body{background:#fff}.wrap{padding:0 12px calc(18px + env(safe-area-inset-bottom));max-width:none}.top{height:58px;position:sticky;top:0;z-index:5;background:#fff;gap:8px;border-bottom:1px solid #edf0f4}.brand{font-size:18px;line-height:1.1}.top .muted{display:none}.reset{min-height:34px;font-size:12px;padding:5px 9px;border-radius:10px}
 .welcome{align-items:flex-start;flex-wrap:wrap;margin:8px 0 4px}.welcome b{width:100%}.welcome span{font-size:12px}.welcome button{padding:6px 9px}.track{gap:5px;margin:8px 0 4px}.trackbtn{padding:8px 4px;font-size:13px;border-radius:11px}.trackbtn small{font-size:9px}.tracknote{font-size:10px;margin-bottom:5px}.stats{grid-template-columns:repeat(4,1fr);gap:5px;margin:7px 0}.stat{border:0;box-shadow:none;background:#f5f7fa;border-radius:11px;padding:6px 2px;font-size:11px;color:#667085}.stat b{font-size:17px;color:#18212f;line-height:1.15;margin-top:2px}
 .card{border:0;box-shadow:none;border-radius:0;padding:4px 0 0}.bar{height:7px}.row{margin:7px 2px 0;font-size:12px}.word{font-size:clamp(31px,10vw,43px);line-height:1.12;margin:18px 0 3px;min-height:42px}.pos{font-size:13px}
 .speak{min-height:42px;margin:8px auto;padding:8px 16px}.choices{grid-template-columns:1fr;margin-top:12px;gap:8px}.choices button{min-height:52px;text-align:left;padding:11px 16px;border-radius:13px;font-size:16px;background:#fff}
 .feedback{margin-top:10px;min-height:20px}.example{margin-top:8px;padding:12px;font-size:15px}.example .speak{margin:8px 0 0}.next{min-height:52px;margin-top:9px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:4}.foot{font-size:11px;margin:10px 5px}
}
@media(max-width:430px){.trackbtn small{display:none}.trackbtn{min-height:42px}}

<div class="top"><div><div class="brand">DJHS English 2000</div><div class="muted">國中英文自主學習・自適應闖關</div></div><button class="reset" id="reset">重設進度</button></div>
<section class="welcome" id="welcome"><b>不知道選哪個？</b><span>直接使用「自動適性」，系統會依你的答題表現調整難度。</span><button id="dismissWelcome" type="button">知道了</button></section><section class="track"><button class="trackbtn active recommended" data-track="auto">自動適性<small>推薦・依表現自動調整</small></button><button class="trackbtn" data-track="core">基礎 1200<small>先把國中核心字學穩</small></button><button class="trackbtn" data-track="full">完整 2000<small>核心＋常用延伸字</small></button><button class="trackbtn" data-track="gept">GEPT 初級<small>全民英檢初級挑戰</small></button></section><div class="tracknote muted" id="tracknote">已載入 2,055 筆可練習資料；官方 1200／2000／GEPT 標記持續校對。</div><section class="stats"><div class="stat">分數<b id="score">0</b></div><div class="stat">連擊<b id="combo">0</b></div><div class="stat">時間<b id="time">10.0</b></div><div class="stat">已熟悉<b id="known">0</b></div></section>
<section class="mastery"><div class="masteryrow"><b>目前題池熟練進度</b><span id="progressText">0 / 0（0%）</span></div><div class="masterybar"><i id="progressFill"></i></div></section><section class="card"><div class="bar"><i id="bar"></i></div><div class="row muted"><span id="mode">英翻中</span><span id="level">新字</span></div>
<div class="word" id="prompt"></div><div class="pos" id="pos"></div><button class="speak" id="speak">🔊 聽發音</button>
<div class="choices" id="choices"></div><div class="feedback" id="feedback"></div>
<div class="example" id="example"><b id="answer"></b><div id="sentence"></div><div class="muted" id="translation"></div><button class="speak" id="speakSentence">🔊 聽例句</button></div>

<div class="foot muted">答錯的單字會較快再次出現；連續答對後會逐漸降低出現頻率。進度儲存在這台裝置。</div>
</main><script src="words.js"></script><script src="app.js"></script></body></html>
