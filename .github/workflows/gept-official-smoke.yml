name: GEPT Official Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/import_gept.py"
      - "tools/ingest_gept.py"
      - "tools/crosscheck_gept.py"
      - "tools/crosscheck_gept_master.py"
      - "tools/diff_official.py"
      - "tools/vocab_identity.py"
      - "tools/test_importers.py"
      - "tools/review_layout_fragments.py"
      - "data/official/sources.json"
      - ".github/workflows/gept-official-smoke.yml"

jobs:
  official-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate importer before downloading official PDFs
        run: |
          python -m py_compile tools/import_gept.py tools/ingest_gept.py tools/crosscheck_gept.py tools/crosscheck_gept_master.py
          python tools/test_importers.py
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download official LTTC PDFs
        run: |
          mkdir -p /tmp/gept
          curl --fail --location --retry 3 -o /tmp/gept/elementary.pdf https://www.lttc.ntu.edu.tw/resources/GEPT/GEPT_Elementary.pdf
          curl --fail --location --retry 3 -o /tmp/gept/intermediate.pdf https://www.lttc.ntu.edu.tw/resources/GEPT/GEPT_Intermediate.pdf
          curl --fail --location --retry 3 -o /tmp/gept/high-intermediate.pdf https://www.lttc.ntu.edu.tw/resources/GEPT/GEPT_High-Intermediate.pdf
      - name: Extract PDF text layer
        run: |
          pdftotext -layout /tmp/gept/elementary.pdf /tmp/gept/elementary.txt
          pdftotext -layout /tmp/gept/intermediate.pdf /tmp/gept/intermediate.txt
          pdftotext -layout /tmp/gept/high-intermediate.pdf /tmp/gept/high-intermediate.txt
      - name: Parse and cross-check all official cumulative lists
        run: python tools/ingest_gept.py /tmp/gept/elementary.txt /tmp/gept/intermediate.txt /tmp/gept/high-intermediate.txt /tmp/gept/out
      - name: Cross-check authoritative GEPT rows against current production master
        run: |
          python tools/crosscheck_gept_master.py /tmp/gept/out/gept-current-high-intermediate.json words.js /tmp/gept/out/gept-vs-master.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/gept/out/gept-vs-master.json",encoding="utf-8"))
          print("GEPT_MASTER_COUNTS",d["counts"])
          print("== unmatched master",len(d["unmatched"]),"==")
          for x in d["unmatched"][:120]:
              print("GEPT_MASTER_UNMATCHED",repr(x.get("w")),repr(x.get("p")),repr(x.get("z")))
          print("== representation review",len(d.get("representationReview",[])),"==")
          for x in d.get("representationReview",[]):
              print("GEPT_REPRESENTATION_REVIEW",repr(x["master"].get("w")),"<->",[c.get("wordId") for c in x["candidates"]])
          print("== residual unmatched",len(d.get("residualUnmatched",[])),"==")
          for x in d.get("residualUnmatched",[]):
              print("GEPT_RESIDUAL_UNMATCHED",repr(x.get("w")),repr(x.get("p")),repr(x.get("z")))
          print("== multi-level review",len(d["multiLevelReview"]),"==")
          for x in d["multiLevelReview"][:80]:
              print("GEPT_MULTI_LEVEL",repr(x["master"].get("w")),x["levels"])
          print("== pos review",len(d["posReview"]),"==")
          for x in d["posReview"][:80]:
              print("GEPT_POS_REVIEW",repr(x["master"].get("w")),repr(x["master"].get("p")),[(r.get("pos"),r.get("level"),r.get("zh")) for r in x["officialRows"]])
          PY
      - name: Review PDF layout fragments
        run: |
          for f in /tmp/gept/out/gept-current-elementary.json /tmp/gept/out/gept-current-intermediate.json /tmp/gept/out/gept-current-high-intermediate.json; do
            python tools/review_layout_fragments.py "$f" "$f.layout-review.json"
          done
      - name: Require zero rejected source blocks
        run: |
          python - <<'PY'
          import json,sys
          bad=[]
          paths=[
              "/tmp/gept/out/gept-current-elementary.json",
              "/tmp/gept/out/gept-current-intermediate.json",
              "/tmp/gept/out/gept-current-high-intermediate.json",
          ]
          for path in paths:
              data=json.load(open(path,encoding="utf-8"))
              if data.get("rejected"):
                  bad.append((path,len(data["rejected"])) )
          print("rejected:",bad)
          if bad:
              sys.exit("Official GEPT smoke has rejected source blocks")
          PY
      - name: Upload normalized smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gept-official-smoke
          path: /tmp/gept/out
          retention-days: 7
      - name: Show extraction summary
        if: always()
        run: |
          echo "=== PDF SHA256 ==="
          sha256sum /tmp/gept/*.pdf || true
          echo "=== OUTPUT FILES ==="
          ls -lh /tmp/gept/out || true
          if compgen -G "/tmp/gept/out/*.json" > /dev/null; then
            for f in /tmp/gept/out/*.json; do
              case "$f" in *.layout-review.json) continue ;; esac
              echo "=== $f ==="
              python -c 'import json,sys; d=json.load(open(sys.argv[1])); print({k:d.get(k) for k in ("sourceDocument","catalogRole","verified")}); print("entries",len(d.get("entries",[])),"rejected",d.get("rejected",[])); print("layoutFragments",d.get("layoutFragments",[])[:30]); print("counts",d.get("counts")); print("checks",d.get("checks"))' "$f" || true
            done
          fi
