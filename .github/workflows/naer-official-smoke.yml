name: NAER Official Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/import_naer.py"
      - "tools/diff_official.py"
      - "tools/crosscheck_naer_table3.py"
      - "tools/audit_identity_collisions.py"
      - "tools/test_importers.py"
      - "data/official/sources.json"
      - ".github/workflows/naer-official-smoke.yml"

jobs:
  official-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate importer
        run: |
          python -m py_compile tools/import_naer.py
          python tools/test_importers.py
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Download official NAER curriculum PDF
        run: |
          mkdir -p /tmp/naer
          curl --fail --location --retry 3 -o /tmp/naer/english-curriculum.pdf 'https://www.naer.edu.tw/upload/1/16/doc/812/%28%E7%99%BC%E5%B8%83%E7%89%88%29%E5%9C%8B%E6%B0%91%E4%B8%AD%E5%B0%8F%E5%AD%B8%E6%9A%A8%E6%99%AE%E9%80%9A%E5%9E%8B%E9%AB%98%E7%B4%9A%E4%B8%AD%E7%AD%89%E5%AD%B8%E6%A0%A1-%E8%AA%9E%E6%96%87%E9%A0%98%E5%9F%9F-%E8%8B%B1%E8%AA%9E%E6%96%87%E8%AA%B2%E7%A8%8B%E7%B6%B1%E8%A6%81.pdf'
          sha256sum /tmp/naer/english-curriculum.pdf
      - name: Extract PDF text layer
        run: pdftotext -layout /tmp/naer/english-curriculum.pdf /tmp/naer/english-curriculum.txt
      - name: Show Appendix 5 heading evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path("/tmp/naer/english-curriculum.txt").read_text(encoding="utf-8",errors="replace")
          for needle in ("1,200","1200","800","表一","表二","表三","參考字彙"):
              print("==",needle,"==")
              start=0
              for _ in range(8):
                  i=t.find(needle,start)
                  if i<0: break
                  print(repr(t[max(0,i-100):i+180]))
                  start=i+len(needle)
          PY
      - name: Show Appendix 5 counting notes
        run: |
          python - <<'PY'
          text=open("/tmp/naer/english-curriculum.txt",encoding="utf-8",errors="replace").read()
          a=text.find("附錄五")
          b=text.find("表一、",a)
          print(text[a:b])
          PY
      - name: Show Table 3 counting evidence
        run: |
          python - <<'PY'
          import re
          text=open("/tmp/naer/english-curriculum.txt",encoding="utf-8",errors="replace").read()
          a=text.find("表三、")
          b=text.find("附錄六",a)
          t=text[a:b if b>0 else None]
          print("TABLE3_CHARS",len(t))
          tflat=re.sub(r"\\s+"," ",t)
          for label in ["a/an","a few","R.O.C./ROC","U.S.A./USA","shoe (s)","roller skate (roller blade)"]:
              print("T3EXACT",label,label.casefold() in tflat.casefold())
          text_all=open("/tmp/naer/english-curriculum.txt",encoding="utf-8",errors="replace").read()
          m1=re.search(r"表一、基本 *1 *, *200 *字（依字母排列）",text_all)
          m2=re.search(r"表二、其他常用 *800 *字（依字母排列）",text_all)
          m3=re.search(r"表三、",text_all[m2.end():])
          src=text_all[m1.end():m2.start()]+" "+text_all[m2.end():m2.end()+m3.start()]
          groups=re.findall(r"([^,\\n]+? *[(][^)]*[)])",src)
          for g in groups:
              g=re.sub(r"\\s+"," ",g).strip()
              main=g.split(" (",1)[0].strip()
              aliases=g[g.find("(")+1:g.rfind(")")].split(",")
              print("T3GROUP",repr(g),"FULL",g.casefold() in tflat.casefold(),"MAIN",main.casefold() in tflat.casefold(),"ALIASES",[(a.strip(),a.strip().casefold() in tflat.casefold()) for a in aliases])
          for term in ["a/an","R.O.C.","U.S.A.","voice","wait","rush","safety","shoe","roller skate"]:
              hits=[m.start() for m in re.finditer(re.escape(term),t,re.I)]
              print("T3TERM",term,len(hits))
              for p in hits[:3]:
                  print(repr(t[max(0,p-100):p+180].replace("\n"," ")))
          PY
      - name: Parse official Appendix 5
        run: python tools/import_naer.py /tmp/naer/english-curriculum.txt /tmp/naer/naer-current.json
      - name: Diagnose parsed NAER entries
        run: |
          python - <<'PY'
          import json
          d=json.load(open("/tmp/naer/naer-current.json",encoding="utf-8"))
          for lid in ("moe-basic-1200","moe-common-2000-extra"):
              rows=[x["officialEntry"] for x in d["entries"] if x["listId"]==lid]
              print("==",lid,len(rows),"==")
              expanded=0
              grouped=[]
              for x in rows:
                  aa=__import__("re").match(r"^(.*?) *[(](.*)[)]$",x)
                  n=1+(len([v for v in aa.group(2).split(",") if v.strip()]) if aa else 0)
                  expanded+=n
                  if aa: grouped.append((x,n))
                  if len(x)>35 or "\\n" in x or "\\f" in x or any(ch.isdigit() for ch in x) or any("\\u4e00"<=ch<="\\u9fff" for ch in x):
                      print("SUSPECT",repr(x))
              print("EXPANDED",expanded,"ALIAS_EXTRA",expanded-len(rows))
              for x in rows:
                  if "/" in x or "(" in x or " " in x:
                      print("FORM",repr(x))
              for x,n in grouped:
                  print("GROUP",n,repr(x))
          PY
      - name: Show duplicate-source contexts
        run: |
          python - <<'PY'
          import re
          text=open("/tmp/naer/english-curriculum.txt",encoding="utf-8",errors="replace").read()
          a=text.find("表一、基本",text.find("附錄五：參考字彙表（2,000 字）",1000))
          b=text.find("表二、其他常用",a)
          t=text[a:b]
          for term in ["may (might)","May","Miss","miss","shirt"]:
              print("SOURCE_TERM",repr(term))
              for m in re.finditer(re.escape(term),t):
                  print(repr(t[max(0,m.start()-100):m.end()+100].replace("\n"," ")))
          PY
      - name: Diagnose canonical NAER duplicates
        run: |
          python - <<'PY'
          import json,collections
          d=json.load(open("/tmp/naer/naer-current.json",encoding="utf-8"))
          by=collections.defaultdict(list)
          for x in d["entries"]:
              by[x["wordId"]].append((x["listId"],x["officialEntry"]))
          dup={k:v for k,v in by.items() if len(v)>1}
          print("CANONICAL_WORDS",len(by),"DUPLICATE_IDS",len(dup),"DUPLICATE_ROWS",sum(len(v)-1 for v in dup.values()))
          for k,v in dup.items(): print("DUP",k,repr(v))
          PY
      - name: Enforce official table boundaries and counts
        run: |
          python - <<'PY'
          import json,sys
          p="/tmp/naer/naer-current.json"
          d=json.load(open(p,encoding="utf-8"))
          rows=d.get("entries",[])
          basic=[x for x in rows if x.get("listId")=="moe-basic-1200"]
          extra=[x for x in rows if x.get("listId")=="moe-common-2000-extra"]
          unknown=[x for x in rows if x.get("listId") not in {"moe-basic-1200","moe-common-2000-extra"}]
          print({"basicRows":len(basic),"extraRows":len(extra),"combinedRows":len(rows),"unknownListRows":len(unknown)})
          declared=d.get("declaredCounts",{})
          expected={"moe-basic-1200":1200,"moe-common-2000-extra":800,"moe-common-2000":2000}
          if unknown or not basic or not extra or declared!=expected:
              sys.exit("NAER official extraction boundary/declared-count invariant failed")
          print({"declaredCounts":declared,"note":"source-entry row counts are diagnostic and are not treated as declared vocabulary counts"})
          PY
      - name: Audit source identity collisions
        run: python tools/audit_identity_collisions.py /tmp/naer/naer-current.json words.js /tmp/naer/naer-identity-collisions.json
      - name: Diff NAER against current production master
        run: python tools/diff_official.py /tmp/naer/naer-current.json words.js /tmp/naer/naer-vs-master.json
      - name: Cross-check master-only forms against Table 3 text
        run: |
          python tools/crosscheck_naer_table3.py /tmp/naer/english-curriculum.txt /tmp/naer/naer-vs-master.json /tmp/naer/table3-crosscheck.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/naer/table3-crosscheck.json",encoding="utf-8"))
          for x in d.get("representationExplainedMisses",[]):
              print("TABLE3_REPRESENTATION_EXPLAINED",repr(x.get("w")),repr(x.get("p")),repr(x.get("z")))
          for x in d.get("residualMisses",[]):
              print("TABLE3_RESIDUAL_MISS",repr(x.get("w")),repr(x.get("p")),repr(x.get("z")))
          PY
      - name: Show NAER diff review queue
        run: |
          python - <<'PY'
          import json
          d=json.load(open("/tmp/naer/naer-vs-master.json",encoding="utf-8"))
          print("DIFF_COUNTS",d["counts"])
          for key in ("missingFromMaster","ambiguous"):
              print("==",key,len(d[key]),"==")
              for x in d[key]:
                  rows=x.get("officialRows",[])
                  print(key.upper(),repr(x.get("wordId")),[(r.get("listId"),r.get("officialEntry")) for r in rows],x.get("reason",""))
          print("== representationReviewCandidates",len(d.get("representationReviewCandidates",[])),"==")
          for x in d.get("representationReviewCandidates",[]):
              print("REPRESENTATION_CANDIDATE",repr(x["officialWordId"]),"<->",repr(x["master"].get("w")))
          print("== unresolvedMissing",len(d.get("unresolvedMissing",[])),"==")
          for x in d.get("unresolvedMissing",[]):
              print("UNRESOLVED_MISSING",repr(x["wordId"]),[(r.get("listId"),r.get("officialEntry")) for r in x.get("officialRows",[])])
          print("== masterOutsideOfficialMatches",len(d["masterOutsideOfficialMatches"]),"==")
          for x in d["masterOutsideOfficialMatches"]:
              print("MASTER_EXTRA",repr(x.get("w")),repr(x.get("p")),repr(x.get("z")))
          PY
      - name: Upload normalized smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naer-official-smoke
          path: |
            /tmp/naer/naer-current.json
            /tmp/naer/english-curriculum.txt
            /tmp/naer/naer-vs-master.json
            /tmp/naer/table3-crosscheck.json
            /tmp/naer/naer-identity-collisions.json
          retention-days: 7
